{% extends 'properties/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-xl shadow-lg border border-gray-100 p-8 my-12">
    <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">{{ title }}</h2>

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        {{ form.non_field_errors }}

        {% for field in form %}
        <div>
            <label class="block text-gray-700 text-sm font-semibold mb-2">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}

        <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition shadow-md mt-6">
            حفظ وتسجيل العقد
        </button>
    </form>
</div>
{% endblock %}
