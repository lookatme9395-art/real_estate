{% extends 'properties/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-8 border border-gray-100 my-8">
    <h2 class="text-2xl font-bold text-gray-900 mb-6">{{ title }}</h2>

    <form method="POST" class="space-y-6">
        {% csrf_token %}
        
        {{ form.non_field_errors }}

        {% for field in form %}
        <div>
            <label class="block text-gray-700 text-sm font-semibold mb-2">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}

        <div class="flex space-x-4 space-x-reverse pt-4">
            <button type="submit" class="bg-blue-600 text-white font-semibold px-6 py-2.5 rounded-lg hover:bg-blue-700 transition">
                حفظ البيانات
            </button>
            <a href="{% url 'dashboard' %}" class="bg-gray-200 text-gray-700 font-semibold px-6 py-2.5 rounded-lg hover:bg-gray-300 transition">
                إلغاء
            </a>
        </div>
    </form>
</div>
{% endblock %}
