{% extends 'properties/base.html' %}

{% block title %}حذف العقار{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-lg border border-gray-100 p-8 my-16 text-center">
    <h2 class="text-2xl font-bold text-red-600 mb-4">تأكيد الحذف</h2>
    <p class="text-gray-700 mb-6">هل أنت متأكد من رغبتك في حذف العقار: <strong class="text-gray-900">{{ property.title }}</strong>؟ لا يمكن التراجع عن هذا الإجراء لاحقاً.</p>

    <form method="POST" class="flex justify-center space-x-4 space-x-reverse">
        {% csrf_token %}
        <a href="{% url 'dashboard' %}" class="bg-gray-300 text-gray-700 px-6 py-2 rounded-lg font-semibold hover:bg-gray-400 transition">إلغاء</a>
        <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-red-700 transition">نعم، احذف</button>
    </form>
</div>
{% endblock %}
