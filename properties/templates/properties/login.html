{% extends 'properties/base.html' %}

{% block title %}تسجيل الدخول - منصة العقارات{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-gray-100 p-8 my-12">
    
    <div class="text-center mb-8">
        <h2 class="text-2xl font-bold text-gray-900">تسجيل الدخول إلى النظام</h2>
        <p class="text-gray-600 text-sm mt-2">أدخل بيانات الحساب الخاص بك للتابعة</p>
    </div>

    {% if error %}
    <div class="bg-red-50 border-r-4 border-red-500 text-red-700 p-4 mb-6 rounded-lg text-sm" role="alert">
        <p>{{ error }}</p>
    </div>
    {% endif %}

    <form method="POST" class="space-y-6">
        {% csrf_token %}
        
        <!-- استبدال حقل اسم المستخدم بهذا الحقل -->
    <div>
        <label class="block text-gray-700 text-sm font-semibold mb-2">البريد الإلكتروني</label>
        <input type="email" name="email" required 
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
            placeholder="name@company.com">
    </div>
        <div>
            <label class="block text-gray-700 text-sm font-semibold mb-2">كلمة المرور</label>
            <input type="password" name="password" required 
                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
        </div>

        <button type="submit" 
                class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition shadow-md">
            دخول
        </button>
    </form>

</div>
{% endblock %}
